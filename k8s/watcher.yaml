apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudshield-watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudshield-watcher
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudshield-watcher
subjects:
  - kind: ServiceAccount
    name: cloudshield-watcher
roleRef:
  kind: Role
  name: cloudshield-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudshield-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudshield-watcher
  template:
    metadata:
      labels:
        app: cloudshield-watcher
    spec:
      serviceAccountName: cloudshield-watcher
      containers:
        - name: watcher
          image: cloudshield-watcher:latest
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
